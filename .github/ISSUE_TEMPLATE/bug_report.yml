name: 🐛 Bug report
description: Something in the plugin behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please note this tracker is for **bugs and feature requests only** —
        installation help and integration questions go to the [Sylius Slack](https://sylius.com/slack),
        or to support@emagma.fr for paid support.

        Before filing, please check the [docs](../../tree/main/docs) — in particular
        [testing.md](../../blob/main/docs/dev/testing.md), which lists known issues.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is a bug in the plugin, not a question about how to use it.
          required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.0.1, or the branch and commit you're on"
    validations:
      required: true

  - type: input
    id: sylius-version
    attributes:
      label: Sylius version
      description: "Output of `composer show sylius/sylius | grep versions`"
      placeholder: "v2.1.3"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.14"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >-
        Be specific enough that a maintainer can follow them on a fresh Sylius install, or on the
        demo image (`docker/demo/`). A bug nobody can reproduce usually gets closed.
      placeholder: |
        1. Install the plugin on a fresh Sylius 2.1 shop
        2. Go to /en_US/withdrawal-request
        3. Submit the form with …
        4. Observe …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Stack trace, `var/log/*.log` excerpt, or browser console output. Pasted as text, not a screenshot.
      render: shell

  - type: textarea
    id: customisations
    attributes:
      label: Relevant customisations
      description: >-
        Overridden templates, a custom notifier, a redefined workflow, a modified form, a custom
        theme — anything of yours that touches the plugin. "None" is a perfectly good answer, and a
        useful one.
    validations:
      required: true
