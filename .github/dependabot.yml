version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Runtime constraints are deliberately wide (sylius/sylius ^2.1, php ^8.2) so the plugin
    # stays installable across the whole line — only dev tooling should be bumped here.
    allow:
      - dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /docker/demo
    schedule:
      interval: monthly
    labels: ["dependencies"]
