version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Runtime constraints are pinned to the Sylius 1 line (sylius/sylius ^1.14.0, php ^8.1,
    # symfony ^6.4) and must not drift — only dev tooling should be bumped here.
    allow:
      - dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /docker/demo
    schedule:
      interval: monthly
    labels: ["dependencies"]
