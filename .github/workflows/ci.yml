# Quality pipeline for the plugin: coding standard, static analysis and unit tests.
# The acceptance suites live in behat.yml — see the note at the top of that file.
#
# There is no committed composer.lock (it is gitignored), so every job resolves dependencies
# with `composer update`. The Symfony line is selected the same way the demo image does it —
# by rewriting `extra.symfony.require` before the update, so Flex pins the whole tree to it.
# Sylius 2.2 accepts ^6.4.1 || ^7.4; see docker/demo/Dockerfile for the reference setup.
name: CI

on:
  push:
    branches:
      - main
      - "2.0"
      - "1.14"
      - docs/open-source-documentation
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_MEMORY_LIMIT: -1
  PHP_EXTENSIONS: intl, gd, zip, bcmath, exif, pdo_mysql

jobs:
  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Check coding standard
        run: vendor/bin/ecs check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

  # Matrix policy: the two most recent Sylius lines, each against the Symfony line(s) it
  # actually declares.
  #
  # Sylius spans two Symfony majors — 2.1 allows ^6.4.1 || ^7.2, 2.2 allows ^6.4.1 || ^7.4 —
  # but only the newest minor of each major is tested. Symfony's last minor of a major is its
  # LTS (6.4, 7.4); the intermediate releases (7.1, 7.2, 7.3) are standard ones, already out
  # of support, and nobody should be starting a shop on them. So the axis is "latest minor
  # per Symfony major that the Sylius line accepts", which for both supported lines is 6.4
  # and 7.4. The legs below are explicit triples marking the edges of that surface:
  #
  #   6.4 LTS   lowest supported everything (2.1 / PHP 8.2) and highest (2.2 / PHP 8.4)
  #   7.4 LTS   both Sylius lines; the newest line across every supported PHP
  #
  # composer.json requires ^2.1 — 2.0 is absent from the upstream support table. Keep the two
  # in step: every leg must be installable per the manifest, and every line the manifest
  # allows must appear in a leg.
  tests:
    name: "Sylius ${{ matrix.sylius }} · Symfony ${{ matrix.symfony }} · PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4 LTS — lowest and highest supported combinations.
          - { sylius: "2.1.*", symfony: "6.4.*", php: "8.2" }
          - { sylius: "2.2.*", symfony: "6.4.*", php: "8.4" }
          # Symfony 7.4 LTS — oldest supported Sylius, then newest across every supported PHP.
          - { sylius: "2.1.*", symfony: "7.4.*", php: "8.2" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.2" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.3" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.4" }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Select Sylius ${{ matrix.sylius }} and Symfony ${{ matrix.symfony }}
        run: |
          composer require sylius/sylius:"${{ matrix.sylius }}" --no-update --no-interaction
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
