# Quality pipeline for the plugin: coding standard, static analysis and unit tests.
# The acceptance suites live in behat.yml — see the note at the top of that file.
#
# There is no committed composer.lock (it is gitignored), so every job resolves dependencies
# with `composer update`. The Symfony line is selected the same way the demo image does it —
# by rewriting `extra.symfony.require` before the update, so Flex pins the whole tree to it.
# Sylius 2.x core accepts ^6.4 || ^7.4; see docker/demo/Dockerfile for the reference setup.
name: CI

on:
  push:
    branches:
      - main
      - "2.0"
      - "1.14"
      - docs/open-source-documentation
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_MEMORY_LIMIT: -1
  PHP_EXTENSIONS: intl, gd, zip, bcmath, exif, pdo_mysql

jobs:
  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Check coding standard
        run: vendor/bin/ecs check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

  # Every Sylius 2.x line accepts either Symfony 6.4 LTS or a 7.x line; what moves between
  # minors is only the floor of the 7.x branch (2.0 -> ^7.1, 2.1 -> ^7.2, 2.2 -> ^7.4). So the
  # legs below are explicit pairs, not a cross-product: each Sylius line is tested against the
  # LTS and against the newest 7.x it actually declares. composer.json allows ^2.0, which is
  # why 2.0 is still covered — drop these legs only together with that constraint.
  tests:
    name: "Tests (Sylius ${{ matrix.sylius }}, Symfony ${{ matrix.symfony }}, PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sylius: "2.0.*", symfony: "6.4.*", php: "8.2" }
          - { sylius: "2.0.*", symfony: "7.1.*", php: "8.3" }
          - { sylius: "2.2.*", symfony: "6.4.*", php: "8.3" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.2" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.3" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.4" }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Select Sylius ${{ matrix.sylius }} and Symfony ${{ matrix.symfony }}
        run: |
          composer require sylius/sylius:"${{ matrix.sylius }}" --no-update --no-interaction
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
