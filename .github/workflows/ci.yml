# Quality pipeline for the plugin: coding standard, static analysis and unit tests.
# The acceptance suites live in behat.yml — see the note at the top of that file.
#
# There is no committed composer.lock (it is gitignored), so every job resolves dependencies
# with `composer update`. The Symfony line is selected the same way the demo image does it —
# by rewriting `extra.symfony.require` before the update, so Flex pins the whole tree to it.
# Sylius 2.x core accepts ^6.4 || ^7.4; see docker/demo/Dockerfile for the reference setup.
name: CI

on:
  push:
    branches:
      - main
      - "2.0"
      - "1.14"
      - docs/open-source-documentation
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_MEMORY_LIMIT: -1
  PHP_EXTENSIONS: intl, gd, zip, bcmath, exif, pdo_mysql

jobs:
  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Check coding standard
        run: vendor/bin/ecs check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: "Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        symfony: ["6.4.*", "7.4.*"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Restrict Symfony to ${{ matrix.symfony }}
        run: composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
