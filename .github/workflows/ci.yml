# Coding standard, static analysis and unit tests. Acceptance suites live in behat.yml.
# No composer.lock is committed, so every job resolves with `composer update`.
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_MEMORY_LIMIT: -1
  PHP_EXTENSIONS: intl, gd, zip, bcmath, exif, pdo_mysql
  # The floor from composer.json (`php: ^8.2`). The single-version jobs below run on it rather
  # than on the newest PHP, so syntax that only parses on a later version (8.3 typed class
  # constants, 8.4 property hooks) fails here instead of reaching a consumer on 8.2.
  PHP_MINIMUM: "8.2"

jobs:
  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINIMUM }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Check coding standard
        run: vendor/bin/ecs check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINIMUM }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

  # Three axes, every value of each covered at least once:
  #   Sylius   2.0 - 2.3       the four supported lines     (composer.json: ~2.0.0 || ... || ~2.3.0)
  #   Symfony  6.4, 7.4, 8.0   the LTS of 6 and 7, plus 8   (intermediate minors are EOL)
  #   PHP      8.2, 8.3, 8.4   every version allowed        (composer.json: ^8.2)
  # Legs are listed explicitly rather than crossed: the full 4x3x3 would include
  # combinations that cannot install (Sylius 2.3 needs PHP 8.3, Symfony 8 needs PHP 8.4 and
  # Sylius 2.3). Newest stack gets every PHP it allows, the edges get one each.
  tests:
    name: "Sylius ${{ matrix.sylius }} · Symfony ${{ matrix.symfony }} · PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4: oldest everything, then newest everything.
          - { sylius: "2.0.*", symfony: "6.4.*", php: "8.2" }
          - { sylius: "2.1.*", symfony: "6.4.*", php: "8.2" }
          - { sylius: "2.2.*", symfony: "6.4.*", php: "8.4" }
          # Symfony 7.4: oldest Sylius on the lowest PHP...
          - { sylius: "2.1.*", symfony: "7.4.*", php: "8.2" }
          # ...then newest Sylius on all three PHP versions.
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.2" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.3" }
          - { sylius: "2.2.*", symfony: "7.4.*", php: "8.4" }
          # Sylius 2.3 (PHP ^8.3)
          - { sylius: "2.3.*", symfony: "6.4.*", php: "8.3" }
          - { sylius: "2.3.*", symfony: "7.4.*", php: "8.3" }
          - { sylius: "2.3.*", symfony: "7.4.*", php: "8.4" }
          # Symfony 8 needs PHP >= 8.4
          - { sylius: "2.3.*", symfony: "8.0.*", php: "8.4" }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Select Sylius ${{ matrix.sylius }} and Symfony ${{ matrix.symfony }}
        run: |
          composer require sylius/sylius:"${{ matrix.sylius }}" --no-update --no-interaction
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
