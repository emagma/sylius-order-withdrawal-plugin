imports:
    - { resource: '@EmagmaSyliusOrderWithdrawalPlugin/config/config.yaml' }

emagma_sylius_order_withdrawal:
    notification_email: '%env(default::WITHDRAWAL_NOTIFICATION_EMAIL)%'

sylius_fixtures:
    suites:
        default:
            fixtures:
                channel:
                    options:
                        custom:
                            fashion_web_store:
                                locales:
                                    - '%locale%'
                                    - 'fr_FR'
                order:
                    options:
                        amount: 0

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# vendor/sylius/test-application ships `doctrine.dbal.charset: UTF8`, MySQL's legacy 3-byte
# charset, which caps every query at 3 bytes however the table itself is encoded — so a utf8mb4
# table still cannot carry emoji or many CJK characters through this harness.
#
# MySQL-only: PostgreSQL rejects utf8mb4 as a client_encoding and the connection fails outright,
# so a PostgreSQL DATABASE_URL needs an explicit `?charset=utf8` to override this — see
# .github/workflows/migrations.yml. Harness only; the plugin configures no DBAL charset.
doctrine:
    dbal:
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

# Sylius registers its Behat context services only in `services_test.php`, which the
# shared test-application kernel never loads (its MicroKernelTrait takes the YAML
# branch and looks for `services_test.yaml`). They are imported, in `test` only, by the
# plugin's own Behat services file, so `behat` can resolve the core Sylius contexts
# referenced by the imported core suites.yml. Path is relative to this file
# (<plugin>/tests/TestApplication/config/).
when@test:
    imports:
        - { resource: '../../Behat/Resources/config/services.php' }

    emagma_sylius_order_withdrawal:
        notification_email: 'sav@example.com'

    # A webserver serving the test environment typically runs with APP_DEBUG=0, while the Behat
    # CLI process inherits the container's default APP_DEBUG=1 — two different debug flags for
    # the same "test" environment. Symfony's cache-pool namespace defaults to a seed built from
    # `kernel.container_class`, which differs between a debug and non-debug container. Without
    # pinning this, `test.mailer_pool` (used by sylius.behat.context.hook.mailer /
    # EmailChecker) resolves to two different filesystem-cache directories depending on which
    # process wrote/read it — so a scenario whose HTTP request is handled by the debug=0
    # webserver caches its sent email in a directory the debug=1 Behat CLI process never looks
    # in, and `hasMessageTo()` always reports "no email sent" even though one was. Pinning
    # prefix_seed makes both processes agree on the same cache directory regardless of which
    # debug flag compiled their container.
    #
    # No scenario is tagged @javascript today, so nothing currently crosses that process
    # boundary and the pin is dormant. Kept because it is exactly what a reintroduced browser
    # scenario would need, and its absence fails as "the feature is broken", not as "the test
    # setup is wrong".
    framework:
        cache:
            prefix_seed: 'emagma_sylius_order_withdrawal_behat_test'
