# Builds and pushes the self-contained demo image (docker/demo/) to the
# project registry, one image per supported Symfony line on Sylius 2.0 (core itself requires
# ^6.4.1 || ^7.1).
#
#   <registry>:2.0-sf6   → Symfony 6.4 · Sylius 2.0
#   <registry>:2.0-sf7   → Symfony 7.1 · Sylius 2.0
#
# Run it:  docker run --rm -p 8080:80 -p 8025:8025 $CI_REGISTRY_IMAGE:2.0-sf6

stages:
  - build

build-demo-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - SYMFONY_VERSION: "6.4.*"
        SF: "6"
      - SYMFONY_VERSION: "7.1.*"
        SF: "7"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-sf${SF}"
    # Reuse the previous image's layers as a cache when present (first run just misses).
    - docker pull "$TAG" || true
    - >
      docker build
      --file docker/demo/Dockerfile
      --build-arg SYMFONY_VERSION="${SYMFONY_VERSION}"
      --cache-from "$TAG"
      --tag "$TAG"
      .
    - docker push "$TAG"
  rules:
    # Build on pushes to the maintained branch and when triggered manually from the UI.
    - if: '$CI_COMMIT_BRANCH == "2.0"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
